name: mirror-odm

# 用途：在 GitHub 海外 runner 上从 Docker Hub 拉 ODM 镜像，同时推到两个地方：
#   ① ghcr.io/<owner>/odm:<tag>                —— 方案A：国内可直连（实测 401=通）
#   ② harborpush.suanleme.cn/<user>/odm:<tag>  —— 方案B：共绩内网仓库，节点 100% 能拉
#
# 放在仓库的 .github/workflows/mirror.yml
#
# ⚠ 需要先在仓库 Settings → Secrets and variables → Actions 添加：
#     HARBOR_USER = perchryum
#     HARBOR_PASS = <共绩镜像仓库密码>
#   不配也能跑，会自动跳过方案B，只推 ghcr.io。
#
# 2026-10-25 修复记录：
#   · `if:` 表达式里**不能用 secrets 上下文**（GitHub 只允许
#     github/needs/vars/strategy/matrix/job/runner/env/steps/inputs）。
#     原写法 `if: secrets.HARBOR_USER != ''` 报
#     "Unrecognized named-value: 'secrets'"，workflow 直接解析失败。
#     → 改为 job 级 env 注入 secret，step 里判断 env.HARBOR_USER。
#   · 新增磁盘清理：ODM GPU 镜像解压后 >10GB，runner 默认只有 ~14GB。
#   · 所有 `name:` 里的裸冒号已去掉（YAML 会把 "xxx:yyy" 误解析成键值对）。

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '要镜像的 tag，空格分隔'
        required: false
        default: 'gpu latest'
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tag: [gpu, latest]
    # ★ 关键：secret 只能在赋值表达式里用，不能在 if 里直接用。
    #   先注入到 env，后面 step 的 if 就能判断 env.HARBOR_USER 是否为空。
    env:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: 环境信息
        run: |
          echo "owner=${{ github.repository_owner }}"
          echo "tag=${{ matrix.tag }}"
          if [ -n "$HARBOR_USER" ]; then
            echo "harborpush 已配置，方案B 会执行"
          else
            echo "harborpush 未配置，方案B 跳过"
          fi

      - name: 从 Docker Hub 拉取镜像
        run: |
          set -e
          TAG="${{ matrix.tag }}"
          docker pull "opendronemap/odm:${TAG}"
          docker image inspect "opendronemap/odm:${TAG}" --format 'size_bytes={{.Size}}'
          df -h / | tail -1

      - name: 登录 GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 推送到 ghcr
        run: |
          set -e
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ matrix.tag }}"
          SRC="opendronemap/odm:${TAG}"
          DST="ghcr.io/${OWNER}/odm:${TAG}"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "OK-A  $DST"

      - name: 登录 harborpush
        if: env.HARBOR_USER != ''
        run: |
          echo "$HARBOR_PASS" | docker login harborpush.suanleme.cn -u "$HARBOR_USER" --password-stdin

      - name: 推送到 harborpush
        if: env.HARBOR_USER != ''
        run: |
          set -e
          TAG="${{ matrix.tag }}"
          SRC="opendronemap/odm:${TAG}"
          DST="harborpush.suanleme.cn/${HARBOR_USER}/odm:${TAG}"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "OK-B  $DST"

      - name: 汇总可用地址
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ matrix.tag }}"
          echo "=============================================="
          echo "tag  ${TAG}"
          echo "A-ghcr        ghcr.io/${OWNER}/odm:${TAG}"
          echo "B-harborpush  harborpush.suanleme.cn/${HARBOR_USER}/odm:${TAG}"
          echo "=============================================="
