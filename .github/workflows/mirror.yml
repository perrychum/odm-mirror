name: mirror-odm

# 用途：在 GitHub 海外 runner 上从 Docker Hub 拉 ODM 镜像，同时推到两个地方：
#   ① ghcr.io/<owner>/odm:<tag>          —— 方案A：国内可直连（实测 401=通）
#   ② harborpush.suanleme.cn/<user>/odm:<tag> —— 方案B：共绩内网仓库，节点 100% 能拉
#
# 为什么两个都推：
#   ghcr.io 国内可直连但共绩节点能不能拉还没验证；harborpush 是共绩自家仓库，
#   一定能拉。两个都推，哪条通就用哪条，不用来回改 workflow。
#
# 放在仓库的 .github/workflows/mirror.yml
#
# ⚠ 需要先在仓库 Settings → Secrets and variables → Actions 添加：
#     HARBOR_USER = pervchum
#     HARBOR_PASS = <共绩镜像仓库密码>
#   （密码在共绩控制台 → 镜像仓库 → 访问凭证 里可查看/重置）
#
# 2026-10-25：新增 harborpush 推送（解决"共绩节点拉不到 Docker Hub"）
#             新增大磁盘清理（ODM GPU 镜像解压后 >10GB，runner 默认空间不够）

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '要镜像的 tag，空格分隔'
        required: false
        default: 'gpu latest'
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write      # 推 ghcr.io 需要

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # GPU 版优先（ODM 的 CUDA 稠密重建），CPU 版顺带
        tag: [gpu, latest]
    steps:
      # ★ 关键：ODM GPU 镜像解压后 10GB+，runner 默认只有 ~14GB 可用，
      #   不清理会 "no space left on device"。删掉用不到的大件腾 20GB+。
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: 环境信息
        run: |
          echo "owner=${{ github.repository_owner }}"
          echo "tag=${{ matrix.tag }}"

      # ---------------- 从 Docker Hub 拉 ----------------
      - name: 拉取 opendronemap/odm:${{ matrix.tag }}
        run: |
          set -e
          docker pull opendronemap/odm:${{ matrix.tag }}
          docker image inspect opendronemap/odm:${{ matrix.tag }} \
            --format '镜像大小={{.Size}} 字节'
          df -h / | tail -1

      # ---------------- 方案A：推 ghcr.io ----------------
      - name: 登录 GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 推送到 ghcr.io
        run: |
          set -e
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC=opendronemap/odm:${{ matrix.tag }}
          DST=ghcr.io/$OWNER/odm:${{ matrix.tag }}
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "✅ 方案A 完成: $DST"

      # ---------------- 方案B：推 harborpush（共绩内网）----------------
      - name: 登录 harborpush
        if: ${{ secrets.HARBOR_USER != '' }}
        run: |
          echo "${{ secrets.HARBOR_PASS }}" | \
            docker login harborpush.suanleme.cn \
              -u "${{ secrets.HARBOR_USER }}" --password-stdin

      - name: 推送到 harborpush
        if: ${{ secrets.HARBOR_USER != '' }}
        run: |
          set -e
          SRC=opendronemap/odm:${{ matrix.tag }}
          DST=harborpush.suanleme.cn/${{ secrets.HARBOR_USER }}/odm:${{ matrix.tag }}
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "✅ 方案B 完成: $DST"

      # ---------------- 汇总 ----------------
      - name: 汇总可用地址
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "=============================================="
          echo "tag = ${{ matrix.tag }}"
          echo "  方案A(ghcr.io)    : ghcr.io/$OWNER/odm:${{ matrix.tag }}"
          echo "  方案B(harborpush) : harborpush.suanleme.cn/<user>/odm:${{ matrix.tag }}"
          echo "=============================================="
